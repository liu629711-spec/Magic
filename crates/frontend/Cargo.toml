[package]
name = "magic-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4"], optional = true }

[features]
# RNG 包装（UUIDv4 幂等键/attempt_id）。默认关闭：windows-gnu 宿主上 getrandom 走
# raw-dylib，需要 MinGW binutils（dlltool+as，本机已通过复制 dlltool 到 ~/.cargo/bin 修复，
# 其他机器需同样处理或装 MSYS2）；宿主单测只覆盖确定性派生逻辑，由 WASM 构建（Yew/Trunk）开启。
# 注意：wasm32 构建时 getrandom 需配置 wasm_js 后端（RUSTFLAGS --cfg getrandom_backend）。
rng = ["dep:uuid"]
