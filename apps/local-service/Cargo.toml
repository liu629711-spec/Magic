[package]
name = "magic-local-service"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
magic-application = { path = "../../crates/application" }
magic-domain = { path = "../../crates/domain" }
magic-execution-port = { path = "../../crates/execution-port" }
magic-execution-opencode-v1 = { path = "../../crates/execution-opencode-v1" }
magic-persistence = { path = "../../crates/persistence" }
magic-persistence-port = { path = "../../crates/persistence-port" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
magic-reconciliation = { path = "../../crates/reconciliation" }
