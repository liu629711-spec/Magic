[package]
name = "magic-desktop-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
gloo = "0.11"
wasm-bindgen-futures = "0.4"
gloo-net = "0.5"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
magic-frontend = { path = "../../../crates/frontend", features = ["rng"] }

# wasm32 上 getrandom 需要 wasm_js 后端（cfg 见 .cargo/config.toml）；
# uuid 需要 rng-getrandom 以使用 getrandom 0.4 作为随机源
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["rng-getrandom"] }
