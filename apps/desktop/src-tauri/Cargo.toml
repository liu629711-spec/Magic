[package]
name = "magic-desktop"
version = "0.1.0"
description = "Magic desktop shell"
authors = ["Magic"]
edition = "2021"

# Tauri has its own host-only dependency graph and is intentionally kept out
# of the WASM/backend workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
