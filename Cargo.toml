[workspace]
resolver = "2"
members = [
  "apps/local-service",
  "crates/domain",
  "crates/contracts",
  "crates/execution-port",
  "crates/execution-opencode-v1",
  "crates/persistence-port",
  "crates/persistence",
  "crates/application",
  "crates/policy",
  "crates/reconciliation",
  "crates/observability",
  "crates/frontend",
]
# 浏览器端 Yew 工程（wasm-only，trunk 构建）：独立于工作区，避免 host/wasm 配置互相干扰
exclude = ["apps/desktop/frontend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

