<!DOCTYPE html><html lang="zh-CN" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Codex Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-styles">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5eef1; /* Match the subtle gradient background */
      background-image: linear-gradient(135deg, #fef6f0 0%, #f4eef5 100%);
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-window {
      width: 1215px;
      height: 760px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .app-header {
      height: 40px;
      background-color: #f9f9fa;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      padding: 0 16px;
      justify-content: space-between;
      -webkit-app-region: drag;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .window-controls span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .wc-minimize { background-color: #fbbf24; }
    .wc-maximize { background-color: #34d399; }
    .wc-close { background-color: #ef4444; }

    .menu-bar {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: #6b7280;
    }

    .sidebar {
      width: 260px;
      background-color: #fbfbfb;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      background-image: linear-gradient(to bottom, #fffdf8 0%, #fbf9f4 100%);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      position: relative;
    }

    .right-sidebar {
      width: 280px;
      background-color: #ffffff;
      border-left: 1px solid #e5e7eb;
      padding: 24px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      color: #4b5563;
      font-size: 14px;
      border-radius: 6px;
      margin: 2px 12px;
      cursor: pointer;
    }

    .nav-item:hover {
      background-color: rgba(0,0,0,0.05);
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
      margin-right: 12px;
      color: #6b7280;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .card:hover {
      border-color: #d1d5db;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .input-area {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 640px;
    }
  </style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" data-snapdom="injected-import"></head>
