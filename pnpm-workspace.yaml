packages:
  - plugins/*
  # dsh-univer-office 是自包含 monorepo（自带 pnpm-workspace.yaml/lockfile/
  # packageManager），按嵌套独立工作区维护，不并入根 workspace：
  # 依赖体积巨大且上游用 insiders 锁文件，并入会让根锁膨胀且破坏上游同步。
  # 构建/安装在该目录内单独执行（cd plugins/dsh-univer-office && pnpm install）。
  - '!plugins/dsh-univer-office'
  # dsh-sidenote 同理：自带 workspace/lockfile（react/tsdown 工具链），
  # 嵌套独立维护，安装/构建在目录内执行（pnpm install && pnpm build）。
  - '!plugins/dsh-sidenote'

# plugins/dsh-better-sidebar 依赖的构建脚本（node-pty 拷贝预编译二进制；
# protobufjs 无源编译）。pnpm 10+ 默认拦截依赖构建脚本，需显式放行。
# electron：plugins/dsh-builtin-browser 的自托管浏览器子进程运行时；
# 钉在 <44（44+ 的包不再随安装下载二进制，README 建议版本线 ≥40，
# 33.x 有合成器缺陷），放行 postinstall 以便安装时拉取二进制（~100MB）。
allowBuilds:
  esbuild: true
  electron: true
  node-pty: true
  protobufjs: true
